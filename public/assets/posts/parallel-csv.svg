<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Parallel CSV processing</title><desc id="d">CSV chunks distributed to parallel workers and merged into one result.</desc><rect width="1200" height="675" fill="#111827"/><text x="70" y="100" fill="#fff" font-family="Arial" font-size="49" font-weight="700">When Parallel CSV Processing Helps</text><text x="72" y="145" fill="#fcd34d" font-family="Arial" font-size="22">MEASURE BEFORE ADDING WORKERS</text><g transform="translate(100 250)" font-family="Arial" text-anchor="middle"><rect width="220" height="170" rx="26" fill="#fff"/><text x="110" y="92" fill="#111827" font-size="28" font-weight="700">CSV CHUNKS</text><g transform="translate(400 -65)" fill="#7c3aed"><rect width="220" height="110" rx="22"/><rect y="135" width="220" height="110" rx="22"/><rect y="270" width="220" height="110" rx="22"/></g><g transform="translate(400 -65)" fill="#fff" font-size="24"><text x="110" y="66">WORKER 1</text><text x="110" y="201">WORKER 2</text><text x="110" y="336">WORKER 3</text></g><rect x="800" width="220" height="170" rx="26" fill="#fff"/><text x="910" y="92" fill="#111827" font-size="28" font-weight="700">MERGE</text><g stroke="#f59e0b" stroke-width="9"><path d="M230 85h140M650 85h120"/><path d="M650 205l120-100M650 340l120-220"/></g></g></svg>
