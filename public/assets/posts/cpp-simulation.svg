<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">C++ simulation</title><desc id="d">A car travelling through a timed game loop with collision boundaries.</desc><rect width="1200" height="675" fill="#101820"/><text x="70" y="102" fill="#fff" font-family="Arial" font-size="51" font-weight="700">C++ for Game Simulation</text><text x="72" y="147" fill="#93c5fd" font-family="Arial" font-size="22">INPUT → UPDATE → COLLISION → RENDER</text><g transform="translate(90 245)" font-family="Arial" font-size="22" text-anchor="middle"><g fill="#1d4ed8"><rect width="190" height="105" rx="24"/><rect x="270" width="190" height="105" rx="24"/><rect x="540" width="190" height="105" rx="24"/><rect x="810" width="190" height="105" rx="24"/></g><g fill="#fff"><text x="95" y="64">INPUT</text><text x="365" y="64">UPDATE</text><text x="635" y="64">COLLISION</text><text x="905" y="64">RENDER</text></g><g stroke="#60a5fa" stroke-width="8"><path d="M195 52h65M465 52h65M735 52h65"/></g></g><g transform="translate(470 445)"><path d="M0 95h270" stroke="#64748b" stroke-width="22"/><rect x="70" y="25" width="140" height="70" rx="22" fill="#f97316"/><path d="M95 25l28-38h55l25 38" fill="none" stroke="#f97316" stroke-width="20"/><circle cx="105" cy="98" r="25" fill="#e2e8f0"/><circle cx="185" cy="98" r="25" fill="#e2e8f0"/></g></svg>
