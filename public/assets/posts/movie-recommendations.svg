<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Movie recommendation pipeline</title><desc id="d">User preferences flowing through candidate retrieval and ranking to a movie list.</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#3b0764"/><stop offset="1" stop-color="#831843"/></linearGradient></defs><rect width="1200" height="675" fill="url(#g)"/><text x="70" y="100" fill="#fff" font-family="Arial" font-size="48" font-weight="700">From Preferences to Recommendations</text><text x="72" y="145" fill="#f5d0fe" font-family="Arial" font-size="22">SIGNALS → CANDIDATES → RANKING → DISCOVERY</text><g transform="translate(85 240)" font-family="Arial" text-anchor="middle"><circle cx="90" cy="150" r="78" fill="#f472b6"/><circle cx="90" cy="120" r="24" fill="#fff"/><path d="M45 200c18-55 72-55 90 0" fill="#fff"/><rect x="260" y="60" width="230" height="180" rx="28" fill="#fff" opacity=".15"/><text x="375" y="135" fill="#fff" font-size="25">CANDIDATES</text><text x="375" y="175" fill="#fbcfe8" font-size="20">content + collaborative</text><rect x="610" y="60" width="200" height="180" rx="28" fill="#f59e0b"/><text x="710" y="160" fill="#431407" font-size="28" font-weight="700">RANK</text><g transform="translate(900 10)"><rect width="170" height="100" rx="18" fill="#7c3aed"/><rect y="115" width="170" height="100" rx="18" fill="#db2777"/><rect y="230" width="170" height="100" rx="18" fill="#f97316"/></g><g stroke="#f9a8d4" stroke-width="9"><path d="M175 150h70M500 150h95M820 150h65"/></g></g></svg>
