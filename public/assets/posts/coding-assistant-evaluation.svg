<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AI coding assistant evaluation</title><desc id="desc">Code suggestions passing tests, review, and quality checks.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101728"/><stop offset="1" stop-color="#12334b"/></linearGradient></defs><rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <text x="70" y="88" fill="#fff" font-family="Arial,sans-serif" font-size="41" font-weight="700">EVALUATING AI CODING ASSISTANTS</text><text x="70" y="125" fill="#8dd9ff" font-family="Arial,sans-serif" font-size="20">Correctness • maintainability • security • speed</text>
  <rect x="70" y="175" width="580" height="390" rx="22" fill="#09111e" stroke="#445b73" stroke-width="3"/><circle cx="105" cy="208" r="8" fill="#ff6b6b"/><circle cx="132" cy="208" r="8" fill="#ffd166"/><circle cx="159" cy="208" r="8" fill="#55e0a3"/>
  <g font-family="Consolas,monospace" font-size="22"><text x="105" y="275" fill="#c792ea">function</text><text x="215" y="275" fill="#82aaff">rankResults</text><text x="350" y="275" fill="#fff">(items) {</text><text x="130" y="318" fill="#c792ea">return</text><text x="220" y="318" fill="#fff">items</text><text x="280" y="318" fill="#89ddff">.filter</text><text x="365" y="318" fill="#fff">(valid)</text><text x="280" y="359" fill="#89ddff">.sort</text><text x="350" y="359" fill="#fff">(byScore);</text><text x="105" y="400" fill="#fff">}</text></g>
  <rect x="100" y="454" width="520" height="78" rx="14" fill="#102536"/><text x="130" y="502" fill="#55e0a3" font-family="Arial,sans-serif" font-size="23" font-weight="700">✓ 42 tests passed</text>
  <g font-family="Arial,sans-serif"><g fill="#183148" stroke-width="3"><rect x="735" y="177" width="385" height="76" rx="18" stroke="#55e0a3"/><rect x="735" y="277" width="385" height="76" rx="18" stroke="#ffd166"/><rect x="735" y="377" width="385" height="76" rx="18" stroke="#8f8cff"/><rect x="735" y="477" width="385" height="76" rx="18" stroke="#ff7aa8"/></g><g fill="#fff" font-size="22" font-weight="700"><text x="775" y="225">TEST RESULTS</text><text x="775" y="325">CODE REVIEW</text><text x="775" y="425">SECURITY CHECK</text><text x="775" y="525">TIME TO ACCEPT</text></g><g font-size="24" font-weight="700" text-anchor="end"><text x="1080" y="225" fill="#55e0a3">PASS</text><text x="1080" y="325" fill="#ffd166">8.7/10</text><text x="1080" y="425" fill="#8f8cff">CLEAR</text><text x="1080" y="525" fill="#ff7aa8">2m 14s</text></g></g>
