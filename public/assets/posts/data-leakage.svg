<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Data leakage</title><desc id="d">A model evaluation split with an improper arrow leaking test information into training.</desc><rect width="1200" height="675" fill="#251014"/><text x="70" y="100" fill="#fff" font-family="Arial" font-size="51" font-weight="700">Data Leakage: How Good Models Fail</text><text x="72" y="145" fill="#fecaca" font-family="Arial" font-size="22">SPLIT FIRST • FIT ON TRAINING DATA • RESPECT TIME</text><g transform="translate(110 245)" font-family="Arial" text-anchor="middle"><rect width="370" height="260" rx="30" fill="#14532d"/><text x="185" y="70" fill="#bbf7d0" font-size="26">TRAIN</text><g fill="#22c55e"><circle cx="100" cy="140" r="25"/><circle cx="185" cy="140" r="25"/><circle cx="270" cy="140" r="25"/></g><rect x="610" width="370" height="260" rx="30" fill="#7f1d1d"/><text x="795" y="70" fill="#fecaca" font-size="26">TEST</text><g fill="#ef4444"><circle cx="710" cy="140" r="25"/><circle cx="795" cy="140" r="25"/><circle cx="880" cy="140" r="25"/></g><path d="M630 210C520 360 410 360 300 210" fill="none" stroke="#facc15" stroke-width="14" stroke-dasharray="20 15"/><path d="M300 210l45-10-22 41z" fill="#facc15"/><circle cx="490" cy="118" r="65" fill="#fff"/><path d="M465 85l62 62M527 85l-62 62" stroke="#dc2626" stroke-width="18"/></g></svg>
