<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Machine learning baseline</title><desc id="d">A simple baseline bar compared with increasingly complex models and costs.</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#082f49"/><stop offset="1" stop-color="#1e3a8a"/></linearGradient></defs><rect width="1200" height="675" fill="url(#g)"/><text x="70" y="100" fill="#fff" font-family="Arial" font-size="49" font-weight="700">Choose a Baseline Before Complexity</text><text x="72" y="145" fill="#bae6fd" font-family="Arial" font-size="22">MEASURE THE IMPROVEMENT THAT ACTUALLY MATTERS</text><g transform="translate(130 220)" font-family="Arial"><path d="M0 340h930M0 0v340" stroke="#7dd3fc" stroke-width="6"/><g><rect x="90" y="215" width="150" height="125" rx="18" fill="#22d3ee"/><rect x="320" y="135" width="150" height="205" rx="18" fill="#3b82f6"/><rect x="550" y="95" width="150" height="245" rx="18" fill="#8b5cf6"/><rect x="780" y="75" width="150" height="265" rx="18" fill="#f97316"/></g><g fill="#fff" font-size="21" text-anchor="middle"><text x="165" y="385">BASELINE</text><text x="395" y="385">LINEAR</text><text x="625" y="385">BOOSTED</text><text x="855" y="385">COMPLEX</text></g><path d="M165 200C400 120 625 80 855 65" fill="none" stroke="#facc15" stroke-width="9" stroke-dasharray="18 14"/></g></svg>
