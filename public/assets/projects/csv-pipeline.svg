  <g font-family="Arial, sans-serif" text-anchor="middle"><g transform="translate(70 240)"><rect width="235" height="210" rx="28" fill="#fff" opacity=".95"/><path d="M55 45h125v120H55z" fill="#e0e7ff" stroke="#6366f1" stroke-width="5"/><path d="M70 75h95M70 102h95M70 129h95" stroke="#6366f1" stroke-width="5"/><text x="118" y="195" font-size="24" fill="#111827">CSV inputs</text></g>
