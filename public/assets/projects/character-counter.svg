<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Character Counter project cover</title><desc id="desc">A text analysis dashboard showing character, word, and sentence counts with letter density.</desc><rect width="1200" height="675" fill="#10131a"/><text x="70" y="94" fill="#fff" font-family="Arial" font-size="50" font-weight="700">Character Counter</text><text x="72" y="138" fill="#b7c0d8" font-family="Arial" font-size="23">REAL-TIME TEXT ANALYSIS</text>
  <g transform="translate(70 190)" font-family="Arial"><rect width="1060" height="390" rx="30" fill="#1b2030" stroke="#343c55" stroke-width="3"/><rect x="38" y="38" width="610" height="190" rx="20" fill="#111521"/><text x="68" y="83" fill="#707b99" font-size="23">Start typing here...</text><path d="M68 116h470M68 151h415M68 186h500" stroke="#343c55" stroke-width="10" stroke-linecap="round"/>
  <g transform="translate(690 38)" text-anchor="middle"><rect width="150" height="124" rx="22" fill="#8b5cf6"/><text x="75" y="58" fill="#fff" font-size="35" font-weight="700">428</text><text x="75" y="91" fill="#ede9fe" font-size="18">characters</text></g><g transform="translate(870 38)" text-anchor="middle"><rect width="150" height="124" rx="22" fill="#38bdf8"/><text x="75" y="58" fill="#082f49" font-size="35" font-weight="700">73</text><text x="75" y="91" fill="#082f49" font-size="18">words</text></g>
  <text x="40" y="285" fill="#fff" font-size="23" font-weight="700">Letter density</text><g transform="translate(40 315)" fill="#a78bfa"><rect width="900" height="18" rx="9"/><rect y="42" width="710" height="18" rx="9"/><rect y="84" width="530" height="18" rx="9"/></g><g fill="#cbd5e1" font-size="20"><text x="970" y="331">E 14%</text><text x="970" y="373">A 11%</text><text x="970" y="415">T 8%</text></g></g>
</svg>
